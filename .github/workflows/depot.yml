name: Update Depot

on:
  release:
  workflow_dispatch:

jobs:
  populate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: LemLib/pros-depot@v0.1.0-beta.1
        with:
          token: ${{ github.token }}
          repo: AutumnLib/autumn
          source-repo: AutumnLib/autumn
          readable-json: true
